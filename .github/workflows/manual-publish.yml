name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must equal the [package] version in Cargo.toml)'
        required: true
      dry_run:
        description: 'Dry run only (do not actually publish)'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      # Routed through env so the raw dispatch input never lands in shell text.
      VERSION_INPUT: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Validate, never mutate: the manifest is the source of truth. Version
      # bumps land via PR (like chore/crates-publish-1.0.0), which also keeps
      # Cargo.lock fresh for --locked builds. CI must not sed or push to main.
      - name: Validate version input against Cargo.toml
        run: |
          set -euo pipefail
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$' <<<"$VERSION_INPUT"; then
            echo "::error::version input '$VERSION_INPUT' is not strict semver (X.Y.Z plus optional -prerelease / +build metadata)"
            exit 1
          fi
          manifest_version="$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/^version = "([^"]*)".*/\1/')"
          if [ "$manifest_version" != "$VERSION_INPUT" ]; then
            echo "::error::Refusing to publish: inputs.version ($VERSION_INPUT) != Cargo.toml [package] version ($manifest_version)."
            echo "::error::Bump Cargo.toml (and Cargo.lock) to $VERSION_INPUT via a PR, merge it, then re-dispatch."
            exit 1
          fi
          echo "inputs.version $VERSION_INPUT matches Cargo.toml [package] version $manifest_version"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # netrain links libpcap; needed before any cargo build (see ci.yml).
      - name: Install libpcap (linux)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify package
        run: cargo package --locked

      - name: Dry run
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: cargo publish --dry-run

      # Test flags mirror ci.yml's test job.
      - name: Run tests
        run: cargo test --locked --no-fail-fast

      - name: Publish to crates.io
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
