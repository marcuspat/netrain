[package]
name = "netrain"
version = "0.2.9"
edition = "2021"
rust-version = "1.82"
authors = ["NetRain Contributors"]
description = "Matrix-style network packet monitor with IP tracking, threat detection and real-time visualization"
license = "MIT"
repository = "https://github.com/marcuspat/netrain"
homepage = "https://github.com/marcuspat/netrain"
documentation = "https://docs.rs/netrain"
readme = "README.md"
keywords = ["network", "monitoring", "packet", "matrix", "tui"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["fuzz/", "demo.gif"]

[dependencies]
pcap = "1.1"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
once_cell = "1.19"
clap = { version = "4", features = ["derive"] }
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3"
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "pipeline"
harness = false
