name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-fail-fast
      # Benchmarks must keep compiling even though CI does not time them.
      - run: cargo bench --no-run --locked

  # The loopback capture test needs root; GitHub's Linux runners allow sudo.
  live-capture:
    name: live capture as root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run loopback capture and privilege-drop test
        shell: bash
        run: |
          set -euo pipefail
          # Build as the runner user so rustup uses its configured toolchain.
          test_binary="$(cargo test --locked --test headless_tests --no-run --message-format=json | jq -ser '
            map(select(.reason == "compiler-artifact" and .target.name == "headless_tests" and .profile.test and .executable != null))
            | if length == 1 then .[0].executable else error("expected one headless_tests executable") end
          ')"
          test_name=live_capture_drops_root_and_keeps_working
          "$test_binary" --list --exact "$test_name" | grep -Fx "$test_name: test"
          # NETRAIN_CI_LIVE makes unmet capture preconditions fail the test.
          sudo env NETRAIN_CI_LIVE=1 timeout --kill-after=5s 60s "$test_binary" --exact "$test_name" --nocapture

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --lib --bins

  fuzz-smoke:
    name: mutation fuzz (1M iterations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Debug build on purpose: arithmetic overflow is checked.
      - run: cargo test --locked --test fuzz_smoke
        env:
          NETRAIN_FUZZ_ITERS: 1000000

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
