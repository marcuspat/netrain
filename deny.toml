# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on any RustSec advisory, including unmaintained crates.
yanked = "deny"

[licenses]
# Permissive licences only; netrain itself is MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
