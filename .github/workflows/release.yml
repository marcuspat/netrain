name: Release

# Builds checksummed binaries when a version tag is pushed. It does not
# publish to crates.io; that stays a deliberate manual step.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  guard:
    name: guard tag against main HEAD and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Release guard (2026-11-17, fleet sweep): a mis-cut tag must never
      # release. Refuse unless the tag version equals the manifest version
      # AND the tagged commit is main HEAD exactly — releases are cut from
      # main HEAD only, never re-tagged from stale commits. crates.io
      # publishing stays manual (manual-publish validates the same way).
      - name: Refuse v-tags that are not main HEAD at manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/^version = "([^"]*)".*/\1/')"
          if [ "$ver" != "${tag#v}" ]; then
            echo "::error::refusing: tag $tag does not match Cargo.toml version $ver"
            exit 1
          fi
          git fetch -q origin main
          main_head="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_head" ]; then
            echo "::error::refusing: tagged commit ${GITHUB_SHA::7} is not main HEAD (${main_head::7}) — releases are cut from main HEAD only"
            exit 1
          fi

  build:
    needs: guard
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="netrain-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/netrain" README.md LICENSE "$name/"
          cp -r docs "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: netrain-${{ matrix.target }}
          path: netrain-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes netrain-*.tar.gz*
